name: testseite

# Testseite des Designsystems (site/, #15) bauen und auf GitHub Pages veröffentlichen.
# Pull Requests: nur bauen (Fehler fallen vor dem Merge auf). main: bauen und ausrollen.
# Voraussetzung fürs Ausrollen: Einstellungen › Pages › Source «GitHub Actions» (einmalig durch Projektverantwortliche:n).
on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'tokens/**', 'icons/**', 'docs/pruefseiten/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/testseite.yml']
  pull_request:
    paths: ['site/**', 'src/**', 'tokens/**', 'icons/**', 'docs/pruefseiten/**', 'scripts/**', 'package.json', 'package-lock.json', '.github/workflows/testseite.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testseite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-site

  ausrollen:
    needs: bauen
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
